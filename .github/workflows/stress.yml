# Stress-прогон: измерение стабильности тестов серией последовательных
# прогонов под -race. Не входит в обязательные проверки PR (не блокирует
# merge): полный набор идёт ~5 минут на прогон, stress умножает на COUNT.
# Дефекты с частотой 0.5–3 % невидимы для одиночного прогона.
name: Stress

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of sequential -race runs"
        required: false
        default: "10"
  schedule:
    # Ночной запуск по UTC.
    - cron: "0 3 * * *"

# Отменять предыдущий незавершённый прогон для той же ветки.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-stress:
    name: make test-stress
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Makefile начинается с `include .env`; файл не отслеживается git.
      - name: Create empty .env required by Makefile
        run: touch .env

      - name: Download dependencies
        run: go mod download

      - name: make test-stress
        env:
          COUNT: ${{ github.event.inputs.count || '10' }}
        run: make test-stress

      # Лог прогона — артефакт для расследования редких падений.
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-log
          path: |
            *.log
          if-no-files-found: ignore
